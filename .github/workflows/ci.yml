name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, types, generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm docs:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.12.0 is the oldest supported version (package.json engines).
        node: ['22.12.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm coverage
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != '24'
        run: pnpm test
      # The tests run the source. Run the packed bundle too, on the oldest supported Node.js and
      # each operating system, where a newer API or a Windows path in the bundle would break.
      - name: Build
        if: matrix.node == '22.12.0'
        run: pnpm build
      - name: Smoke-test the packed tarball
        if: matrix.node == '22.12.0'
        run: pnpm smoke
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  package:
    name: Build and verify the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      node: ${{ steps.node.outputs.node }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke-test the packed tarball
        run: pnpm smoke
      # The steps of the build and publish jobs in release.yml, with a dry run: this job packs
      # the tarball and hands it over as an artifact, and the publish rehearsal below publishes
      # it without a checkout or an install. A dry run still refuses a version npm already has,
      # so the rehearsal uses a version npm has never seen.
      - name: Record the Node.js version for the publish rehearsal
        id: node
        run: |
          node=$(cat .node-version)
          if ! [[ $node =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.node-version holds \"$node\", not a version such as 24.0.0."
            exit 1
          fi
          echo "node=$node" >>"$GITHUB_OUTPUT"
      - name: Rehearse the release's pack
        id: pack
        run: |
          version="0.0.0-ci.$GITHUB_RUN_ID"
          npm version "$version" --no-git-tag-version
          mkdir dist-pack
          npm pack --pack-destination dist-pack
          tarball="agentcheckup-$version.tgz"
          if [ "$(ls dist-pack)" != "$tarball" ]; then
            echo "::error::npm pack did not write exactly $tarball."
            exit 1
          fi
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist-pack/$tarball" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist-pack/
          if-no-files-found: error
          retention-days: 1

  publish-rehearsal:
    name: Rehearse the publish job
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout and no install: the publish job in release.yml runs no code of this repository
    # or its dependencies while it can request an OIDC token.
    permissions: {}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist-pack
      - name: Check the tarball
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          if [ "$(ls dist-pack)" != "$TARBALL" ]; then
            echo "::error::The artifact does not hold exactly $TARBALL."
            exit 1
          fi
          echo "$SHA256  dist-pack/$TARBALL" | sha256sum --check --strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.package.outputs.node }}
          registry-url: https://registry.npmjs.org
      - name: Publish as a dry run
        # ./ makes npm read a file: without it, dist-pack/x.tgz is a GitHub repository spec.
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: npm publish "./dist-pack/$TARBALL" --dry-run --access public --tag ci
