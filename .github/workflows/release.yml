name: Release

on:
  push:
    branches: [main]
  # Publishes the release of an existing tag again, when its publish job failed: release tags
  # are immutable, so the fix lands on main and this run builds the tag with it. It needs the
  # same environment approval as every publish.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create release commits, tags and GitHub releases
      pull-requests: write # open and update the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.release-please.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: configure required reviewers in the repository settings, so every
    # publish needs a human approval. npm trusted publishing is bound to this workflow and
    # environment; no npm token exists anywhere. See docs/maintainers/releasing.md.
    environment:
      name: npm
      url: https://www.npmjs.com/package/agentcheckup
    permissions:
      contents: write # upload the tarball to the GitHub release
      id-token: write # npm trusted publishing and provenance (OIDC)
      attestations: write # store the build provenance attestation
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$TAG\" is not a release tag such as v0.1.0."
            exit 1
          fi
          echo "TAG=$TAG" >>"$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Check that the tag holds that version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json says $version, but the tag is $TAG."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Pack
        run: |
          mkdir dist-pack
          npm pack --pack-destination dist-pack
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-pack/*.tgz
      - name: Publish with npm trusted publishing (OIDC)
        run: npm publish dist-pack/*.tgz --provenance --access public
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist-pack/*.tgz --clobber
