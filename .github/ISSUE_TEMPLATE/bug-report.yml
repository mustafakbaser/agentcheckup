name: Bug report
description: agentcheck crashed, hung, or behaved incorrectly (not a false positive).
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the full command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal repository, or the files and directory layout needed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentcheck version
      placeholder: Output of `npx agentcheck --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
      placeholder: macOS 26.1, Node 24.22.0
    validations:
      required: true
