version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches minimumReleaseAge in pnpm-workspace.yaml. Without it, Dependabot proposes versions
    # that pnpm then refuses to install.
    cooldown:
      default-days: 7
    ignore:
      # Types follow the oldest supported Node.js (package.json engines: >=22.12). Newer majors
      # would let code use APIs that Node.js 22 does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pinned below 6.1 until typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    # A dependency is in the first group that matches it. Every dependency is a devDependency,
    # so `bundled` comes first: tsdown bundles these packages into dist/ (THIRD_PARTY_NOTICES.md
    # lists them with their own dependencies), so a bump changes the code users run. Dependabot
    # sets one commit message prefix per ecosystem, not per group: retitle a `bundled` pull
    # request to `fix(deps): ...` before merging it, so the bump gets a changelog entry and a
    # release. See docs/maintainers/releasing.md#dependency-updates.
    groups:
      bundled:
        patterns:
          - ignore
          - jsonc-parser
          - mdast-util-from-markdown
          - picomatch
          - yaml
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
