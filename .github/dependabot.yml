version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches minimumReleaseAge in pnpm-workspace.yaml. Without it, Dependabot proposes versions
    # that pnpm then refuses to install.
    cooldown:
      default-days: 7
    ignore:
      # Types follow the oldest supported Node.js (package.json engines: >=22.12). Newer majors
      # would let code use APIs that Node.js 22 does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pinned below 6.1 until typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
